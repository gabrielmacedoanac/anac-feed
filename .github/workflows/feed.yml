name: Anac Feed

on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/feed.yml'
  schedule:
    - cron: '0 */4 * * *'  # Executa a cada 4h
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Instalar Chromium do Playwright
        run: deno run -A npm:playwright@1.64.1 install --with-deps chromium

      - name: ▶️ Executar script Deno
        run: deno run --allow-net --allow-read --allow-write --allow-run --allow-env --allow-sys --allow-ffi src/main.ts

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatic Update Anac Feed"
