name: Anac Feed

on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/feed.yml'
  schedule:
    - cron: '0 */4 * * *'  # Executa a cada 4h
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Playwright
        run: npm install --no-save playwright@1.64.1

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium

      - name: ▶️ Executar script Deno
        run: >
          deno run
          --allow-net
          --allow-read
          --allow-write
          --allow-run
          --allow-env
          --allow-sys
          --allow-ffi
          src/main.ts

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatic Update Anac Feed"
